[project]
name = "math"
entry = "mod.mr"

# Only the submodule namespaces are exported here. The flat helpers (abs, sign,
# min, max, clamp, sum, avg, ...) are defined directly in mod.mr and are reached
# as math::<name> without an export; a submodule's symbols are never re-exported
# under a second name, so a consumer never has to choose between math::abs and
# math::int::abs. Listing a function twice in this table (as the old int/float
# re-export blocks did) produced duplicate TOML keys, which made the manifest
# unparsable: the exports map came back empty and every `load kioto::math::<sub>`
# in mod.mr then re-entered the package that was still loading, failing with
# "Cyclic local load detected at modules/math/mod.mr".
[exports]
mod    = "mod.mr"
consts = "consts/mod.mr"
seq    = "seq/mod.mr"
int    = "int/mod.mr"
float  = "float/mod.mr"
random = "random/mod.mr"
sum    = "sum/mod.mr"
stats  = "stats/mod.mr"
power  = "power/mod.mr"
trig   = "trig/mod.mr"
