[project]
name = "kioto"
version = "2.5.0"
description = "Standard lib for Mire"
entry = "code/mod.mire"

[build]
compiler = "mire"
profile = "debug"
opt-level = 0
artifact = "shared"
runtime = "full"
target = "x86_64-unknown-linux-gnu"
panic = "abort"
incremental = true
debug-info = true

[paths]
sources = "."
tests = "tests"
output = "bin"
cache = "bin/.cache"
generated = "bin/generated"

[cfg]
publisher = "publish.toml"
registry = "local"

[dependencies]
mire = { path = "../mire" }
kioto = { path = "." }

[security]
mode = "strict"
externs = ["rt_*", "pal_*"]
extern_libs = ["c"]
macros = ["assert", "assert_eq", "assert_ne", "dbg", "trace_i64"]
deps = { mire = "macros" }

[exports]
strings = "core/strings"
time    = "core/time"
fs      = "core/fs"
env     = "core/env"
proc    = "core/proc"
async   = "core/async"
mem     = "core/mem"
cpu     = "core/cpu"
math    = "core/math"
net     = "core/net"
log     = "core/log"
cli     = "core/cli"
crypto  = "core/crypto"

["owl@lock"]
version = "3"
