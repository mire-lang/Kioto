[project]
name = "kioto"
version = "2.4.7"
description = "Standard library for Mire"
entry = "code/mod.mire"

[build]
compiler = "mire"
profile = "debug"
opt-level = 0

[paths]
sources = "."
tests = "tests"
output = "bin"
cache = "bin/.cache"

[dependencies]
mire = { path = "../mire" }

# Strict security mode. kioto's own externs are PAL (`pal_*`) and runtime
# helpers (`rt_*`); mire's library macros (`assert!`/`dbg!`) are allowlisted
# and mire is trusted at the "Macros" tier so its `[macros]` auto-scope into
# kioto tests/code under strict mode.
[security]
mode = "strict"
externs = ["rt_*", "pal_*"]
extern_libs = ["c"]
macros = ["assert", "dbg"]
deps = { mire = "macros" }

[exports]
strings = "core/strings"
time    = "core/time"
fs      = "core/fs"
env     = "core/env"
proc    = "core/proc"
async   = "core/async"
mem     = "core/mem"
cpu     = "core/cpu"
math    = "core/math"
net     = "core/net"
log     = "core/log"
cli     = "core/cli"
crypto  = "core/crypto"
